name: Publish to MCP Registry

# Runs after the npm package exists for the tagged version: the registry
# verifies ownership by reading `mcpName` from the PUBLISHED npm package, so
# this must never race ahead of the npm publish in release.yml. Tag pushes
# gate on the version being live on npm; workflow_dispatch allows re-publishing
# the registry entry for an already-released version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC auth to the MCP registry — no stored secret

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify server.json, package.json, and npm agree on the version
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          SRV_VERSION=$(jq -r .version server.json)
          SRV_PKG_VERSION=$(jq -r '.packages[0].version' server.json)
          test "$SRV_VERSION" = "$PKG_VERSION"
          test "$SRV_PKG_VERSION" = "$PKG_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "v${PKG_VERSION}"
          fi
          # Wait for the npm publish (release.yml) to land before claiming
          # ownership — the registry reads mcpName from the published tarball.
          for i in $(seq 1 30); do
            LIVE=$(npm view "disclosures@${PKG_VERSION}" version 2>/dev/null || true)
            if [ "$LIVE" = "$PKG_VERSION" ]; then
              echo "npm has disclosures@${PKG_VERSION}"
              exit 0
            fi
            echo "waiting for disclosures@${PKG_VERSION} on npm ($i/30)..."
            sleep 20
          done
          echo "disclosures@${PKG_VERSION} never appeared on npm" >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: ./mcp-publisher publish
