name: Publish to MCP Registry

# release.yml calls this only after npm publication succeeds. Manual dispatch
# recovers a failed registry submission for an existing, published release tag.

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag already published to npm
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag already published to npm, such as v0.8.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC auth to the MCP registry — no stored secret

concurrency:
  group: mcp-registry-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify the merged release tag and published npm artifact
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          PKG_VERSION=$(jq -r .version package.json)
          test "$RELEASE_TAG" = "v${PKG_VERSION}"
          test "$(jq -r .version server.json)" = "$PKG_VERSION"
          test "$(jq -r '.packages[0].version' server.json)" = "$PKG_VERSION"
          test "$(jq -r '.packages[0].identifier' server.json)" = "$(jq -r .name package.json)"
          test "$(jq -r .name server.json)" = "$(jq -r .mcpName package.json)"
          npm view "disclosures@${PKG_VERSION}" --json > "$RUNNER_TEMP/published-package.json"
          test "$(jq -r .version "$RUNNER_TEMP/published-package.json")" = "$PKG_VERSION"
          test "$(jq -r .mcpName "$RUNNER_TEMP/published-package.json")" = "$(jq -r .name server.json)"
          test "$(jq -r .gitHead "$RUNNER_TEMP/published-package.json")" = "$(git rev-parse HEAD)"

      - name: Install checksum-verified mcp-publisher
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - name: Publish server.json to MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" publish'
