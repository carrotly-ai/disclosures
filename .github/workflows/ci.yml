name: PR baseline
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: pr-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: bun install --frozen-lockfile
    - run: bun run typecheck
    - run: bun run test
    - run: bun run build
    - run: bun run test:stdio
    - run: node scripts/check-runtime.mjs
    - name: Verify installed packed-package consumer
      run: node scripts/check-package.mjs
on:
  pull_request: {}
  workflow_dispatch: {}
