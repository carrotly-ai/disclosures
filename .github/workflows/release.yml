name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release versions and require tags to reference merged commits
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git merge-base --is-ancestor HEAD origin/main
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          fi
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const manifest = JSON.parse(readFileSync("server.json", "utf8"));
          const sourceVersion = readFileSync("src/server.ts", "utf8")
            .match(/export const SERVER_VERSION = "([^"]+)";/)?.[1];
          if (process.env.GITHUB_REF.startsWith("refs/tags/")) {
            assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          }
          assert.equal(manifest.version, pkg.version);
          assert.equal(manifest.packages[0].version, pkg.version);
          assert.equal(sourceVersion, pkg.version);
          assert.equal(manifest.name, pkg.mcpName);
          assert.equal(manifest.packages[0].identifier, pkg.name);
          JS
      - run: bun install --frozen-lockfile
      - name: Audit the complete dependency lockfile
        run: bun audit
      - run: bun --no-env-file run typecheck
      - run: bun --no-env-file run test
      - run: bun --no-env-file run build
      - run: bun --no-env-file run test:stdio

  live:
    name: Release source validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require all live-source credentials
        env:
          DISCLOSURES_USER_AGENT: ${{ secrets.DISCLOSURES_USER_AGENT }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          missing=()
          for variable in DISCLOSURES_USER_AGENT COMPANIES_HOUSE_API_KEY OPENDART_API_KEY EDINET_API_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Missing required live-source credentials: ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun --no-env-file run build
      - name: Check current keyless source contracts
        run: node scripts/source-canary.mjs
      - name: Require a fresh strict live suite before publication
        env:
          DISCLOSURES_USER_AGENT: ${{ secrets.DISCLOSURES_USER_AGENT }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          LIVE_E2E_REQUIRE_ALL: "1"
        run: bun --no-env-file test ./tests/live/e2e.live.ts --timeout 300000

  compatibility:
    name: Release compatibility (Node ${{ matrix.node }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun --no-env-file run build
      - run: node scripts/check-runtime.mjs
      - run: node scripts/check-package.mjs

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [compatibility, live]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # OIDC trusted publishing requires npm >= 11.5 on a supported Node runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun --no-env-file run build
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@11
          npm --version
      - name: Publish to npm with provenance
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

  publish-registry:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp.yml
    with:
      release_tag: ${{ github.ref_name }}
