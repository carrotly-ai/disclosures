name: Source canary

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Check bounded keyless source contracts
        run: node scripts/source-canary.mjs --report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-canary
          path: source-canary.json
          if-no-files-found: warn
