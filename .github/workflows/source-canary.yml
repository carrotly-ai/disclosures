name: Source canary

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 2" # Tuesdays at 03:23 UTC / 11:23 Singapore.

permissions:
  contents: read

concurrency:
  group: source-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun --no-env-file run build
      - name: Check bounded keyless source contracts
        run: node scripts/source-canary.mjs --report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-canary
          path: source-canary.json
          if-no-files-found: warn
          retention-days: 30
