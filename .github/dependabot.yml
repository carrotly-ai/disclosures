version: 2
updates:
  # Bun security updates are not supported by Dependabot. Weekly version
  # updates complement the complete-lockfile bun audit gate.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      compatible-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:43"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
