version: 2
updates:
  # Bun security updates are not supported by Dependabot. Weekly version
  # updates complement the complete-lockfile bun audit gate.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    ignore:
      # Node typings track the oldest supported runtime (engines.node >=18).
      # Raise them only together with the engines floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      compatible-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:43"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
